<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .checkbox-container {
      margin-bottom: 20px;
    }
    .recipe {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
    }
    .recipe h2 {
      margin: 0;
      cursor: pointer;
      font-size: 18px;
    }
    .recipe-details {
      display: none;
      margin-top: 10px;
      font-size: 14px;
    }
    .recipe-details p {
      margin: 4px 0;
      white-space: pre-wrap;
    }
    label {
      font-size: 12px;
    }

    body {
      background-color: #ffffff;
      color: #0f0f0f;
    }
    a {
      color: rgb(55, 55, 55);
    }
    .highlight {
      background-color: yellow;
    }
    @media (prefers-color-scheme: dark) {
      a {
        color: rgb(175, 175, 175);
      }
      label {
        color: rgb(175, 175, 175);
      }
      body {
        background-color: #090909;
        color: #ffffff;
      }
      input {
        border-radius: 4px;
        box-sizing: border-box;
        border: 1px #666;
        background: rgb(35, 34, 43);
        color: #fff;
      }
      .recipe {
        border: 1px solid rgb(103, 103, 103);
      }
      .highlight {
        background-color: rgb(103, 103, 103); 
      }
    }
  </style>
</head>
<body>
  <input type="text" id="search" placeholder="Поиск по рецептам..." />
  <div class="checkbox-container">
    <input type="checkbox" id="includeCooking" />
    <label for="includeCooking">Искать в "Как готовить"</label>

    <input type="checkbox" id="includeAlternatives" />
    <label for="includeAlternatives">Искать в "Замены"</label>
  </div>
  <div id="recipeList"></div>
  <hr>
  <form enctype="multipart/form-data">
    <input id="upload" type="file" accept="application/json" name="recipes">
  </form>
  <a href="javascript:clearRecipesData()">Удалить рецепты</a>
  <script>
    function parseLocationHash() {
      try {

        return JSON.parse(decodeURIComponent(escape(atob(window.location.hash.substring(1)))))  
      }
      catch(e) {
        console.log(e)
      }
    }

    var recipesObject = {"recipes": [], "version": 2};

    if(localStorage["recipes.object"]) {
      recipesObject = JSON.parse(localStorage["recipes.object"])
    }

    if(window.location.hash.length > 2) {
      const objectFromHash = parseLocationHash()
      if(objectFromHash) {
        recipesObject = objectFromHash;
      }
    }

    var recipes = recipesObject.recipes || [];


    function generateSingleRecipeLocationHash(recipeIndex) {
        const hashValue = btoa(unescape(encodeURIComponent(JSON.stringify({
          recipes: [recipes[recipeIndex]]
        }))))
        return hashValue
    }

    function copySingleRecipeLink(recipeIndex) {
      const url = new URL(window.location.href);
      url.hash = generateSingleRecipeLocationHash(recipeIndex)
      navigator.clipboard.writeText(url.href);
    }

    function goToSingleRecipe(recipeIndex) {
      window.location.hash = generateSingleRecipeLocationHash(recipeIndex);
      window.location.reload()
    }

    function goToRecipeList() {
      window.location.hash = "";
      window.location.reload()
    }

    function clearRecipesData() {
      if (window.confirm(
          "Удалить рецепты? Их придется загрузить заново. Влияет только на этот браузер.")) {
        localStorage.removeItem("recipes.object")
        window.location.reload();
      }
    }

    const recipeList = document.getElementById('recipeList');
    const searchInput = document.getElementById('search');
    const includeCookingCheckbox = document.getElementById('includeCooking');
    const includeAlternativesCheckbox = document.getElementById('includeAlternatives');
    const uploadInput = document.getElementById("upload");

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlightText(text, filter) {
      if (!filter) return text;

      const words = filter.split(/\s+/).filter(word => word.length > 0);

      const positiveWords = words.filter(word => word[0] !== '-');
      if (positiveWords.length === 0) return text;

      const escapedWords = positiveWords.map(word => escapeRegExp(word));
      const pattern = escapedWords.map(word => `(?:${word})`).join('|');

      const regex = new RegExp(pattern, 'gi');
      return text.replace(regex, match => '<span class="highlight">' + match + '</span>');
    }

    function createRecipeElement(recipe, index, filter) {
      const container = document.createElement('div');
      container.className = 'recipe';

      const header = document.createElement('h2');
      header.innerHTML = highlightText(recipe.name, filter);
      container.appendChild(header);

      const details = document.createElement('div');
      details.className = 'recipe-details';
      var innerHTML = '<p>' + highlightText(recipe.initial_text, filter) + '</p>' +
        '<p><strong>Ингредиенты:</strong><br>' + highlightText(recipe.ingredients, filter) + '</p>' +
        '<p><strong>Как готовить:</strong><br>' + highlightText(recipe.cooking, filter) + '</p>';
      if(recipe.alternatives) {
        innerHTML += '<p><strong>Замены:</strong><br>' + highlightText(recipe.alternatives, filter) + '</p>';
      }
      innerHTML += '<p><small>' + recipe.source + '</small></p>'
      if(recipes.length == 1) {
        if(localStorage["recipes.object"]) {
          innerHTML += "<p><a href='javascript:goToRecipeList()'>К списку рецептов</a></p>"  
        }
      } else {
        innerHTML += "<p><a href='javascript:copySingleRecipeLink(" + index + ")'>Скопировать ссылку на рецепт</a></p>"  
      }
      
      details.innerHTML = innerHTML;
      container.appendChild(details);

      header.addEventListener('click', function() {
        details.style.display = details.style.display === 'block' ? 'none' : 'block';
      });

      if(recipes.length == 1) {
        details.style.display = 'block';
      }

      return container;
    }

    function renderRecipes(filter = '') {
      recipeList.innerHTML = '';
      const includeCooking = includeCookingCheckbox.checked;
      const includeAlternatives = includeAlternativesCheckbox.checked;

      const words = filter.split(/\s+/).filter(word => word.trim() !== '');

      const positiveWords = words
        .filter(word => word[0] !== '-')
        .map(word => word.toLowerCase());

      const negativeWords = words
        .filter(word => word[0] === '-')
        .map(word => word.slice(1).toLowerCase());

      recipes.forEach((recipe, index) => {
        let combinedText = recipe.name + ' ' + recipe.initial_text + ' ' + recipe.ingredients;
        if (includeAlternatives) {
          combinedText += ' ' + recipe.alternatives;
        }
        if (includeCooking) {
          combinedText += ' ' + recipe.cooking;
        }
        const lowerCombinedText = combinedText.toLowerCase();

        let includeRecipe = true;

        for (const pos of positiveWords) {
          if (!lowerCombinedText.includes(pos)) {
            includeRecipe = false;
            break;
          }
        }

        if(includeRecipe) {
          for (const neg of negativeWords) {
            if (lowerCombinedText.includes(neg)) {
              includeRecipe = false;
              break;
            }
          }
        }

        if (includeRecipe) {
          const recipeElement = createRecipeElement(recipe, index, filter);
          recipeList.appendChild(recipeElement);
        }
      });
    }

    async function handleRecipesChange(file) {
      const text = await file.text();
      return JSON.parse(text)
    }

    searchInput.addEventListener('input', function() {
      renderRecipes(this.value);
    });

    includeCookingCheckbox.addEventListener('change', function() {
      renderRecipes(searchInput.value);
    });

    includeAlternativesCheckbox.addEventListener('change', function() {
      renderRecipes(searchInput.value);
    });

    uploadInput.addEventListener("change", async function() {
      recipesObject = await handleRecipesChange(this.files[0]);
      localStorage["recipes.object"] = JSON.stringify(recipesObject)
      recipes = recipesObject.recipes;
      renderRecipes(searchInput.value)
    }, false);

    renderRecipes();
  </script>
</body>
</html>
